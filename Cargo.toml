[workspace]
resolver = "2"
members = [
    "crates/alfred-core",
    "crates/alfred-planner",
    "crates/alfred-reviewer",
    "crates/alfred-executor",
    "crates/alfred-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive"] }

alfred-core = { path = "crates/alfred-core" }
alfred-executor = { path = "crates/alfred-executor" }
alfred-planner = { path = "crates/alfred-planner" }
alfred-reviewer = { path = "crates/alfred-reviewer" }
