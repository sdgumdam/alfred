[workspace]
resolver = "2"
members = [
    "crates/alfred-core",
    "crates/alfred-planner",
    "crates/alfred-reviewer",
    "crates/alfred-executor",
    "crates/alfred-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
alfred-core = { path = "crates/alfred-core" }
alfred-planner = { path = "crates/alfred-planner" }
alfred-reviewer = { path = "crates/alfred-reviewer" }
serde = { version = "1", features = ["derive"] }
alfred-executor = { path = "crates/alfred-executor" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
